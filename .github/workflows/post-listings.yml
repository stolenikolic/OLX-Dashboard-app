# =============================================================================
# Post Listings — postavlja nove oglase po profilu (bez duplikata).
# Cron svakih 15 min: samo profili kojima je due fiksni termin + OLX 24h prozor.
# Ručno: opcionalno profile_id (bypass schedule) + category_id (skip import).
# =============================================================================
name: post-listings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      profile_id:
        description: "Ručno: pokreni samo za jedan profil (uuid)"
        required: false
      category_id:
        description: "Ručno: samo jedna kategorija (uuid); skip import"
        required: false
      skip_import:
        description: 'Preskoči OLX import ("true" / "false")'
        required: false
        default: ""
      dry_run:
        description: '"true" = dry-run'
        required: false
        default: "false"

concurrency:
  group: post-listings
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      has_profiles: ${{ steps.list.outputs.has_profiles }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: list
        name: Lista due profila za postavljanje
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONLY_PROFILE_ID: ${{ github.event.inputs.profile_id }}
        run: npm run job:list-due-post-profiles

  post:
    needs: prepare
    if: ${{ needs.prepare.outputs.has_profiles == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Post listings for profile
        env:
          PROFILE_ID: ${{ matrix.profile.id }}
          CATEGORY_ID: ${{ github.event.inputs.category_id }}
          SKIP_IMPORT: ${{ github.event.inputs.skip_import }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run job:post-listings -- --dry-run
          else
            npm run job:post-listings
          fi
